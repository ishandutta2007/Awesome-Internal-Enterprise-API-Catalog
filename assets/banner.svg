<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" style="background: #0B0F19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Mesh Glows -->
    <radialGradient id="meshGlowCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshGlowPurple" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshGlowBlue" cx="50%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
      <circle cx="40" cy="0" r="1" fill="#64748b" fill-opacity="0.4"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .glow-node {
      animation: pulseNode 4s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: dash 25s linear infinite;
    }
    .flow-line-rev {
      stroke-dasharray: 6, 6;
      animation: dashRev 20s linear infinite;
    }
    .dynamic-orb-1 {
      animation: floatOrb1 10s ease-in-out infinite alternate;
    }
    .dynamic-orb-2 {
      animation: floatOrb2 12s ease-in-out infinite alternate;
    }
    .pill {
      transition: all 0.3s ease;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -400;
      }
    }
    @keyframes dashRev {
      to {
        stroke-dashoffset: 400;
      }
    }
    @keyframes pulseNode {
      0% { r: 4px; opacity: 0.5; }
      100% { r: 7px; opacity: 1; }
    }
    @keyframes floatOrb1 {
      0% { transform: translate(0, 0); }
      100% { transform: translate(40px, -25px); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-30px, 35px); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="420" fill="url(#grid)" rx="16"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="dynamic-orb-1">
    <circle cx="180" cy="120" r="140" fill="url(#meshGlowCyan)"/>
  </g>
  <g class="dynamic-orb-2">
    <circle cx="1020" cy="180" r="160" fill="url(#meshGlowPurple)"/>
  </g>
  <circle cx="600" cy="360" r="130" fill="url(#meshGlowBlue)"/>

  <!-- Outer Frame Border -->
  <rect x="1" y="1" width="1198" height="418" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" rx="15"/>

  <!-- Dynamic Animated Microservice / API Catalog Grid (Background & Lower Sides) -->
  <g opacity="0.45">
    <!-- Connecting animated circuit lines -->
    <path class="flow-line" d="M 80 80 Q 250 140 450 80 T 750 100 T 1120 70" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
    <path class="flow-line-rev" d="M 100 340 Q 300 280 600 350 T 1100 330" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5"/>
    <path class="flow-line" d="M 1100 90 L 1050 220 L 1140 330" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.4"/>
    <path class="flow-line-rev" d="M 120 90 L 70 200 L 140 320" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Network / Catalog Nodes -->
    <circle class="glow-node" cx="80" cy="80" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <circle class="glow-node" cx="450" cy="80" r="5" fill="#818cf8"/>
    <circle class="glow-node" cx="750" cy="100" r="5" fill="#c084fc"/>
    <circle class="glow-node" cx="1120" cy="70" r="6" fill="#38bdf8" filter="url(#glow)"/>

    <circle class="glow-node" cx="100" cy="340" r="5" fill="#a855f7"/>
    <circle class="glow-node" cx="600" cy="350" r="5" fill="#38bdf8"/>
    <circle class="glow-node" cx="1100" cy="330" r="6" fill="#ec4899" filter="url(#glow)"/>

    <circle class="glow-node" cx="70" cy="200" r="4" fill="#06b6d4"/>
    <circle class="glow-node" cx="1050" cy="220" r="5" fill="#8b5cf6"/>
  </g>

  <!-- FOREGROUND: Pill Tag -->
  <g transform="translate(600, 75)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="-150" cy="0" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="5" y="5" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.5">ENTERPRISE API GOVERNANCE &amp; DISCOVERY</text>
  </g>

  <!-- FOREGROUND: Main Title -->
  <g transform="translate(600, 160)">
    <text x="0" y="0" text-anchor="middle" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.8">Awesome Internal Enterprise API Catalog</text>
  </g>

  <!-- FOREGROUND: Subtitle -->
  <g transform="translate(600, 208)">
    <text x="0" y="0" text-anchor="middle" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated Ecosystem of Internal Developer Portals (IDP), Service Catalogs, Schema Registries &amp; API Governance
    </text>
  </g>

  <!-- FOREGROUND: Category Feature Badges / Pills -->
  <g transform="translate(600, 275)">
    <!-- Pill 1: IDP & Portals -->
    <g transform="translate(-390, 0)">
      <rect x="0" y="-16" width="175" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <circle cx="20" cy="1" r="4" fill="#38bdf8"/>
      <text x="32" y="5" fill="#f1f5f9" font-size="12" font-weight="600">Developer Portals</text>
    </g>

    <!-- Pill 2: API Discovery -->
    <g transform="translate(-195, 0)">
      <rect x="0" y="-16" width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <circle cx="20" cy="1" r="4" fill="#818cf8"/>
      <text x="32" y="5" fill="#f1f5f9" font-size="12" font-weight="600">API Discovery Hubs</text>
    </g>

    <!-- Pill 3: Service Catalog -->
    <g transform="translate(5, 0)">
      <rect x="0" y="-16" width="175" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <circle cx="20" cy="1" r="4" fill="#a855f7"/>
      <text x="32" y="5" fill="#f1f5f9" font-size="12" font-weight="600">Service Catalogs</text>
    </g>

    <!-- Pill 4: Schema & Governance -->
    <g transform="translate(200, 0)">
      <rect x="0" y="-16" width="190" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <circle cx="20" cy="1" r="4" fill="#ec4899"/>
      <text x="32" y="5" fill="#f1f5f9" font-size="12" font-weight="600">OpenAPI &amp; Governance</text>
    </g>
  </g>

  <!-- FOREGROUND: Bottom Meta Line -->
  <g transform="translate(600, 350)">
    <text x="0" y="0" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b" letter-spacing="0.5">
      REST • GraphQL • gRPC • AsyncAPI • Microservice Topology • Contract Testing
    </text>
  </g>
</svg>
